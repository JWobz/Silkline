[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "silkline"
version = "1.0.0"
description = "Control a Line 6 Spider V MkII amp over USB (not affiliated with Line 6)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Wobz"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JWobz/silkline"
Issues = "https://github.com/JWobz/silkline/issues"

[project.scripts]
silkline = "silkline.cli:main"

[tool.setuptools]
packages = ["silkline", "silkline.protocol"]

[tool.setuptools.package-data]
silkline = ["handshake.txt"]